server:
  port: 8079

spring:
  application:
    name: api-gateway

# API-Gateway Configuration for different services
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**

            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/products/**

            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/inventories/**

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/orders/**

            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/payment/**

            - id : shipping-service
              uri: lb://SHIPPING-SERVICE
              predicates:
                - Path=/shipping/**

            - id: review-service
              uri: lb://REVIEW-SERVICE
              predicates:
                - Path=/reviews/**


# Eureka server configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
